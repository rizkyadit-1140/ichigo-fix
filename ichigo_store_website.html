<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICHIGOSTORE - TopUp & Jual Akun</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="tempat-header"></div>

    <header class="banner-slider">
        <div class="slider-container" id="sliderContainer">
            <div class="slide active"><img src="images/banner1.jpg" alt="Banner 1"></div>
            <div class="slide active"><img src="images/banner2.jpg" alt="Banner 2"></div>
            <div class="slide active"><img src="images/banner3.jpg" alt="Banner 3"></div>
        </div>
        <div class="dots-container" id="dotsContainer">
            <span class="dot active" onclick="goToSlide(0)"></span>
            <span class="dot" onclick="goToSlide(1)"></span>
            <span class="dot" onclick="goToSlide(2)"></span>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="section-title">
                <div class="ribbon-banner">
                    <img src="images/petir.png" alt="Petir" class="ribbon-icon">
                    
                    <span class="ribbon-text">Flash Sale</span>
                    <span class="ribbon-timer" id="countdown">23:59:59</span>
                </div>
            </div>
            
            <div class="grid-flash">
                <a href="javascript:void(0)" onclick="bukaFlashSale('mlbb', 'Starlight Member')" class="bungkus-kotak-flash-sale">
                    <div class="card-flash-img"><img src="images/sale1.png" alt="Promo Flash Sale 1"></div>
                </a>
                <a href="javascript:void(0)" onclick="bukaFlashSale('freefire', 'Elite Pass')" class="bungkus-kotak-flash-sale">
                <div class="card-flash-img"><img src="images/sale2.png" alt="Promo Flash Sale 2"></div>
                </a>
                <a href="javascript:void(0)" onclick="bukaFlashSale('mlbb', '350 Diamonds')" class="bungkus-kotak-flash-sale">
                    <div class="card-flash-img"><img src="images/sale3.png" alt="Promo Flash Sale 3"></div>
                </a>
                <a href="javascript:void(0)" onclick="bukaFlashSale('genshin', 'Blessing of the Welkin Moon')" class="bungkus-kotak-flash-sale">
                    <div class="card-flash-img"><img src="images/sale4.png" alt="Promo Flash Sale 4"></div>
                </a>
            </div>
        </section>

        <section class="section">
            <div class="section-title"><img src="images/bannerakunfix.png" alt="Banner Beli Akun" class="ribbon-akun-full"></div>
            <div class="grid-akun">
                <a href="beli-akun-opbr.html" class="card-akun-img"><img src="images/akun1.png" alt="Akun OPBR"></a>
                <a href="beli-akun-ml.html" class="card-akun-img"><img src="images/akun2.png" alt="Akun MLBB"></a>
                <a href="beli-akun-ff.html" class="card-akun-img"><img src="images/akun3.png" alt="Akun Free Fire"></a>
                <a href="beli-akun-valo.html" class="card-akun-img"><img src="images/akun4.png" alt="Akun Valorant"></a>
                <a href="beli-akun-pubg.html" class="card-akun-img"><img src="images/akun5.png" alt="Akun pubg"></a>
        </section>

        <section class="section">
            <div class="section-title"><img src="images/BannerTop.png" alt="Banner Top Up Game" class="ribbon-topup-full"></div>

            <div class="grid-topup">
                <a href="javascript:void(0)" onclick="bukaTopup('mlbb')" class="card-topup-img"><img src="images/top1.png" alt="Top Up MLBB"></a>
                <a href="javascript:void(0)" onclick="bukaTopup('genshin')" class="card-topup-img"><img src="images/top2.png" alt="Top Up Genshin Impact"></a>
                <a href="javascript:void(0)" onclick="bukaTopup('freefire')" class="card-topup-img"><img src="images/top3.png" alt="Top Up Free Fire"></a>
                <a href="javascript:void(0)" onclick="bukaTopup('pubgm')" class="card-topup-img"><img src="images/top4.png" alt="Top Up PUBG Mobile"></a>
                <a href="javascript:void(0)" onclick="bukaTopup('valorant')" class="card-topup-img"><img src="images/top5.png" alt="Top Up Valorant"></a>
                <a href="javascript:void(0)" onclick="bukaTopup('cs2')" class="card-topup-img"><img src="images/top6.png" alt="Top Up Counter Strike"></a>
                <a href="javascript:void(0)" onclick="bukaTopup('roblox')" class="card-topup-img"><img src="images/top7.png" alt="Top Up Roblox"></a>
                <a href="javascript:void(0)" onclick="bukaTopup('wuwa')" class="card-topup-img"><img src="images/top8.png" alt="Top Up wuthering waves"></a>
            </div>
        </section>

    </main>
    <script src="load-header.js"></script>
    <script src="script.js"></script>

    <script>
        function bukaTopup(idGame) {
            // Simpan ID game yang diklik ke Local Storage
            localStorage.setItem('game_terpilih', idGame);
            
            // Pindah ke file HTML "Satu Etalase Ajaib"
            window.location.href = 'halaman-topup.html';
        }
        function bukaFlashSale(idGame, namaItem) {
            localStorage.setItem('game_terpilih', idGame);
            localStorage.setItem('item_preselect', namaItem); // Titip nama item ke memori
            window.location.href = 'halaman-topup.html';
        }
    </script>
    

</body>
</html>
