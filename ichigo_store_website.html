<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICHIGOSTORE - TopUp & Jual Akun</title>
    <!-- Menyambungkan ke CSS murni -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Bagian Navigasi -->
    <nav class="navbar">
        <div class="logo">ICHIGOSTORE</div>
        <div class="search-bar">
            <input type="text" placeholder="Cari produk di sini...">
            <button>🔍</button>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Produk</a></li>
            <li><a href="#">Riwayat</a></li>
            <li><a href="#">Jual Akun</a></li>
            <li><button class="btn-masuk">Masuk</button></li>
        </ul>
    </nav>

    <!-- Bagian Banner Utama -->
    <!-- Bagian Banner Utama (Slider) -->
    <header class="banner-slider">
        <div class="slider-container" id="sliderContainer">
            <!-- Ganti src="..." dengan nama file gambarmu nanti, contoh: "banner1.jpg" -->
            <div class="slide active">
                <img src="images/banner1.jpg" alt="Banner 1">
            </div>
            <div class="slide active">
                <img src="images/banner2.jpg" alt="Banner 2">
            </div>
            <div class="slide active">
                <img src="images/banner3.jpg" alt="Banner 3">
            </div>
        </div>
        <div class="dots-container" id="dotsContainer">
            <span class="dot active" onclick="goToSlide(0)"></span>
            <span class="dot" onclick="goToSlide(1)"></span>
            <span class="dot" onclick="goToSlide(2)"></span>
        </div>
    </header>

    <main>
        <!-- Bagian Flash Sale -->
        <!-- Bagian Flash Sale -->
        <section class="section">
            <div class="section-title">
                <div class="ribbon-banner">
                    <!-- Memanggil gambar petir milikmu -->
                    <img src="images/petir.png" alt="Petir" class="ribbon-icon">
                    
                    <span class="ribbon-text">Flash Sale</span>
                    <span class="ribbon-timer" id="countdown">23:59:59</span>
                </div>
            </div>
            
            <div class="grid-flash">
                <!-- Kotak Produk 1 Menggunakan Gambar Full -->
                <div class="card-flash-img">
                    <!-- Ganti "gambar-flash-1.png" dengan nama file gambarmu yang sebenarnya -->
                    <img src="images/sale1.png" alt="Promo Flash Sale 1">
                </div>
                
                <!-- Kotak Produk 2 Menggunakan Gambar Full -->
                <div class="card-flash-img">
                    <!-- Ganti "gambar-flash-2.png" dengan nama file gambarmu yang sebenarnya -->
                    <img src="images/sale2.png" alt="Promo Flash Sale 2">
                </div>
                
                <!-- Kalau ada 3 atau 4 produk, tinggal copy-paste blok div "card-flash-img" di atas -->
                 <div class="card-flash-img">
                    <!-- Ganti "gambar-flash-2.png" dengan nama file gambarmu yang sebenarnya -->
                    <img src="images/sale3.png" alt="Promo Flash Sale 2">
                </div>
                <div class="card-flash-img">
                    <!-- Ganti "gambar-flash-2.png" dengan nama file gambarmu yang sebenarnya -->
                    <img src="images/sale4.png" alt="Promo Flash Sale 2">
                </div>
            </div>
        </section>

        <!-- ============================== -->
        <!-- BAGIAN BELI AKUN               -->
        <!-- ============================== -->
        <!-- ============================== -->
        <!-- BAGIAN BELI AKUN               -->
        <!-- ============================== -->
        <section class="section">
            <div class="section-title">
                <!-- Gambar Banner Beli Akun Utuh (Pita + Teks menyatu) -->
                <!-- Ganti "banner-beli-akun.png" dengan nama file gambarmu -->
                <img src="images/bannerakunfix.png" alt="Banner Beli Akun" class="ribbon-akun-full">
            </div>

            <!-- Area Geser Produk Beli Akun (Tetap sama seperti sebelumnya) -->
            <div class="grid-akun">
                <div class="card-akun-img">
                    <img src="images/akun1.png" alt="Akun OPBR">
                </div>
                <div class="card-akun-img">
                    <img src="images/akun2.png" alt="Akun MLBB">
                </div>
                <div class="card-akun-img">
                    <img src="images/akun3.png" alt="Akun Free Fire">
                </div>
                <div class="card-akun-img">
                    <img src="images/akun4.png" alt="Akun Valorant">
                </div>
                <div class="card-akun-img">
                    <img src="images/akun5.png" alt="Akun pubg">
                </div>
                <!-- dan seterusnya... -->
        </section>
        <!-- ============================== -->
        <!-- BAGIAN TOP UP GAME             -->
        <!-- ============================== -->
        <section class="section">
            <div class="section-title">
                <!-- Gambar Banner Top Up Utuh (Pita + Teks menyatu) -->
                <!-- Ganti "banner-topup.png" dengan nama file gambarmu -->
                <img src="images/BannerTop.png" alt="Banner Top Up Game" class="ribbon-topup-full">
            </div>

            <!-- Area Grid Produk Top Up (Katalog Tersusun) -->
            <div class="grid-topup">
                <!-- Kotak Produk Top Up 1 -->
                <div class="card-topup-img">
                    <img src="images/top1.png" alt="Top Up MLBB">
                </div>
                
                <!-- Kotak Produk Top Up 2 -->
                <div class="card-topup-img">
                    <img src="images/top2.png" alt="Top Up Genshin Impact">
                </div>
                
                <!-- Kotak Produk Top Up 3 -->
                <div class="card-topup-img">
                    <img src="images/top3.png" alt="Top Up Free Fire">
                </div>
                
                <!-- Kotak Produk Top Up 4 -->
                <div class="card-topup-img">
                    <img src="images/top4.png" alt="Top Up PUBG Mobile">
                </div>
                <div class="card-topup-img">
                    <img src="images/top5.png" alt="Top Up Valorant">
                </div>
                <div class="card-topup-img">
                    <img src="images/top6.png" alt="Top Up Counter Strike">
                </div>
                <div class="card-topup-img">
                    <img src="images/top7.png" alt="Top Up Roblox">
                </div>
                <div class="card-topup-img">
                    <img src="images/top8.png" alt="Top Up wuthering waves">
                </div>
                <!-- Bisa terus di-copy-paste sebanyak jumlah game yang kamu punya -->
            </div>
        </section>
        <!-- ============================== -->
        <!-- BAGIAN JOKI GAME               -->
        <!-- ============================== -->
        <section class="section">
            <div class="section-title">
                <!-- Gambar Banner Joki Utuh (Pita + Teks menyatu) -->
                <img src="images/bannerjoki.png" alt="Banner Joki" class="ribbon-joki-full">
            </div>

            <!-- Area Grid Produk Joki (Katalog Tersusun) -->
            <div class="grid-joki">
                <!-- Kotak Produk Joki 1 -->
                <div class="card-joki-img">
                    <img src="images/joki1.png" alt="Joki MLBB">
                </div>
                
                <!-- Kotak Produk Joki 2 -->
                <div class="card-joki-img">
                    <img src="images/joki2.png" alt="Joki FF">
                </div>
                <div class="card-joki-img">
                    <img src="images/joki3.png" alt="Joki FF">
                </div>
                <!-- Tambahkan kotak lainnya sesuai kebutuhan -->
            </div>
        </section>
    </main>

    <!-- Menyambungkan ke file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
