<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Akun Free Fire - Ichigo Store</title>
    <link rel="stylesheet" href="style.css"> <!-- Tetap pakai CSS yang sama -->
</head>
<body>

    <!-- ========================================== -->
    <!-- PASTE KODE NAVBAR DARI HALAMAN UTAMA DISINI -->
    <!-- ========================================== -->
    
    <!-- Wadah Utama Halaman Katalog Akun -->
    <div class="container-akun-katalog">
        
        <!-- ============================== -->
        <!-- BAGIAN KIRI: SIDEBAR FILTER    -->
        <!-- ============================== -->
        <aside class="sidebar-filter">
            <h3>Filter</h3>
            
            <div class="filter-group">
                <label>Rank Tertinggi</label>
                <select>
                    <option>Pilih Rank Tertinggi</option>
                    <option>Grandmaster</option>
                    <option>Master</option>
                    <option>Heroic / Master Tua</option>
                    <option>Diamond ke Bawah</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Harga Minimal</label>
                <div class="input-rp">
                    <span>Rp</span>
                    <input type="number" placeholder="">
                </div>
            </div>

            <div class="filter-group">
                <label>Harga Maksimal</label>
                <div class="input-rp">
                    <span>Rp</span>
                    <input type="number" placeholder="">
                </div>
            </div>

            <div class="filter-group">
                <label>Urutkan Harga</label>
                <div class="radio-group">
                    <input type="radio" id="termurah" name="urutkan">
                    <label for="termurah">Termurah Ke Termahal</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="termahal" name="urutkan">
                    <label for="termahal">Termahal Ke Termurah</label>
                </div>
            </div>

            <button class="btn-filter">Filter</button>
            <button class="btn-reset">Reset Filter</button>
        </aside>

        <!-- ============================== -->
        <!-- BAGIAN KANAN: KONTEN PRODUK    -->
        <!-- ============================== -->
        <main class="content-akun">
            
            <!-- Pencarian -->
            <div class="search-akun-bar">
                <input type="text" placeholder="Cari Bundle Cobra, SG 2 Ungu, Evo Gun dll">
                <button>Cari</button>
            </div>

            <!-- Grid Produk Akun -->
            <div class="grid-katalog-akun">
                
                <!-- Kotak Akun FF 1 -->
                <div class="card-katalog-item">
                    <!-- Ganti src dengan gambar akun FF dari komputermu -->
                    <img src="akun-ff-1.jpg" alt="Akun FF"> 
                    <div class="card-katalog-info">
                        <h4>Akun Sultan | Bundle Cobra | SG 2 Ungu | AK Draco Max</h4>
                        <p class="harga-coret">Rp 950.000</p>
                        <p class="harga-asli">Rp 899.999</p>
                    </div>
                </div>

                <!-- Kotak Akun FF 2 -->
                <div class="card-katalog-item">
                    <img src="akun-ff-2.jpg" alt="Akun FF">
                    <div class="card-katalog-info">
                        <h4>Akun Old | Elite Pass S1 | Scar Titan | Baju Ruok</h4>
                        <p class="harga-coret">Rp 1.500.000</p>
                        <p class="harga-asli">Rp 1.250.000</p>
                    </div>
                </div>

                <!-- Kotak Akun FF 3 -->
                <div class="card-katalog-item">
                    <img src="akun-ff-3.jpg" alt="Akun FF">
                    <div class="card-katalog-info">
                        <h4>Akun Spek Turni | MP40 Predatory | Set Budi01</h4>
                        <p class="harga-coret">Rp 450.000</p>
                        <p class="harga-asli">Rp 399.999</p>
                    </div>
                </div>

                <!-- Tambahkan kotak lainnya sesuai stok akun FF yang kamu miliki -->

            </div>
        </main>
    </div>

</body>
</html>
