<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Akun OPBR - Ichigo Store</title>
    <link rel="stylesheet" href="style.css"> <!-- Tetap menggunakan CSS yang sama -->
</head>
<body>

    <!-- Wadah Utama Halaman Katalog Akun -->
    <div class="container-akun-katalog">
        
        <!-- BAGIAN KIRI: SIDEBAR FILTER -->
        <aside class="sidebar-filter">
            <h3>Filter</h3>
            

            <div class="filter-group">
                <label>Harga Minimal</label>
                <div class="input-rp">
                    <span>Rp</span>
                    <input type="number" placeholder="">
                </div>
            </div>

            <div class="filter-group">
                <label>Harga Maksimal</label>
                <div class="input-rp">
                    <span>Rp</span>
                    <input type="number" placeholder="">
                </div>
            </div>

            <div class="filter-group">
                <label>Urutkan Harga</label>
                <div class="radio-group">
                    <input type="radio" id="termurah" name="urutkan">
                    <label for="termurah">Termurah Ke Termahal</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="termahal" name="urutkan">
                    <label for="termahal">Termahal Ke Termurah</label>
                </div>
            </div>

            <button class="btn-filter">Filter</button>
            <button class="btn-reset">Reset Filter</button>
        </aside>

        <!-- BAGIAN KANAN: KONTEN PRODUK -->
        <main class="content-akun">
            
            <!-- Pencarian -->
            <div class="search-akun-bar">
                <input type="text" placeholder="Cari Karakter EX, Bounty Fest, RDS dll">
                <button>Cari</button>
            </div>

            <!-- Grid Produk Akun -->
            <div class="grid-katalog-akun">
                
                <!-- Kotak Akun OPBR 1 -->
                <div class="card-katalog-item" style="cursor: pointer;"
                    data-judul="Gear 5 Luffy | EX Zoro | Max Boost 2 | 1000 RDS"
                    data-harga="Rp 799.999"
                    data-kode="OPBR-01"
                    data-gambar="images/skinop.png"
                    data-gambarss="images/spekop.png"
                    data-spek="League: SS League|Char EX: Gear 5 & Zoro|RDS: 1000|Boost: Max 2">
                    
                    <img src="images/skinop.png" alt="Akun OPBR"> 
                    <div class="card-katalog-info">
                        <h4>Gear 5 Luffy | EX Zoro | Max Boost 2 | 1000 RDS</h4>
                        <p class="harga-coret">Rp 850.000</p>
                        <p class="harga-asli">Rp 799.999</p>
                    </div>
                </div>

                <!-- Kotak Akun OPBR 2 -->
                <div class="card-katalog-item" style="cursor: pointer;"
                    data-judul="EX Roger V2 | Shanks Kamusari | Support 150%"
                    data-harga="Rp 549.999"
                    data-kode="OPBR-02"
                    data-gambar="images/skinop1.png"
                    data-gambarss="images/spekop1.png"
                    data-spek="League: S+ League|Char EX: Roger V2 & Shanks|Support: 150%">
                    
                    <img src="images/skinop1.png" alt="Akun OPBR">
                    <div class="card-katalog-info">
                        <h4>EX Roger V2 | Shanks Kamusari | Support 150%</h4>
                        <p class="harga-coret">Rp 600.000</p>
                        <p class="harga-asli">Rp 549.999</p>
                    </div>
                </div>

                <!-- Kotak Akun OPBR 3 -->
                <div class="card-katalog-item" style="cursor: pointer;"
                    data-judul="Starter Klaw | Yace | 2500 RDS | Siap Gacha"
                    data-harga="Rp 119.999"
                    data-kode="OPBR-03"
                    data-gambar="images/skinop2.png"
                    data-gambarss="images/spekop2.png"
                    data-spek="League: Starter|Char EX: Klaw & Yace|RDS: 2500|Status: Unbind">
                    
                    <img src="images/skinop2.png" alt="Akun OPBR">
                    <div class="card-katalog-info">
                        <h4>Starter Klaw | Yace | 2500 RDS | Siap Gacha</h4>
                        <p class="harga-coret">Rp 150.000</p>
                        <p class="harga-asli">Rp 119.999</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Panggil fungsi filter dan fungsi pemindah data -->
    <script src="script-beli-akun.js"></script>
    <script src="script-katalog.js"></script> 
</body>
</html>
