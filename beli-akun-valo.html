<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Akun Valorant - Ichigo Store</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <!-- Wadah Utama Halaman Katalog Akun -->
    <div class="container-akun-katalog">
        
        <!-- BAGIAN KIRI: SIDEBAR FILTER -->
        <aside class="sidebar-filter">
            <h3>Filter</h3>

            <div class="filter-group">
                <label>Harga Minimal</label>
                <div class="input-rp">
                    <span>Rp</span>
                    <input type="number" placeholder="">
                </div>
            </div>

            <div class="filter-group">
                <label>Harga Maksimal</label>
                <div class="input-rp">
                    <span>Rp</span>
                    <input type="number" placeholder="">
                </div>
            </div>

            <div class="filter-group">
                <label>Urutkan Harga</label>
                <div class="radio-group">
                    <input type="radio" id="termurah" name="urutkan">
                    <label for="termurah">Termurah Ke Termahal</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="termahal" name="urutkan">
                    <label for="termahal">Termahal Ke Termurah</label>
                </div>
            </div>

            <button class="btn-filter">Filter</button>
            <button class="btn-reset">Reset Filter</button>
        </aside>

        <!-- BAGIAN KANAN: KONTEN PRODUK -->
        <main class="content-akun">
            
            <div class="search-akun-bar">
                <input type="text" placeholder="Cari Vandal Kuronami, Reaver, Champions dll">
                <button>Cari</button>
            </div>

            <div class="grid-katalog-akun">
                
                <!-- Kotak Akun Valo 1 -->
                <div class="card-katalog-item" style="cursor: pointer;"
                    data-judul="Vandal Solar | Vandal Blackthorn | Phantom Kuronami"
                    data-harga="Rp 150.000"
                    data-kode="VALO-01"
                    data-gambar="images/skin-valo3.jpg"
                    data-gambarss="images/ss-valo01.jpg,images/ss-valo02.jpg,images/ss-valo03.jpg"
                    data-spek="Total Skin: 15|Rank: Ascendant|Agent Terbuka: Semua">
                    
                    <img src="images/skin-valo3.jpg" alt="Akun Valorant"> 
                    <div class="card-katalog-info">
                        <h4>Vandal Solar | Vandal Blackthorn</h4>
                        <p class="harga-coret">Rp 300.000</p>
                        <p class="harga-asli">Rp 150.000</p>
                    </div>
                </div>

                <!-- Kotak Akun Valo 2 -->
                <div class="card-katalog-item" style="cursor: pointer;"
                    data-judul="Bundle Mystbloom | Primordium Phantom"
                    data-harga="Rp 250.000"
                    data-kode="VALO-02"
                    data-gambar="images/skin-valo2.png"
                    data-gambarss="images/ss-valo-1.jpg,images/ss-valo-2.jpg,images/ss-valo-3.jpg,images/ss-valo-4.jpg"
                    data-spek="Total Skin: 8|Rank: Imo|Agent Terbuka: Semua">
                    
                    <img src="images/skin-valo2.png" alt="Akun Valorant"> 
                    <div class="card-katalog-info">
                        <h4>Bundle Mystbloom | Primordium Phantom</h4>
                        <p class="harga-coret">Rp 400.000</p>
                        <p class="harga-asli">Rp 250.000</p>
                    </div>
                </div>

                <!-- Kotak Akun Valo 3 -->
                <div class="card-katalog-item" style="cursor: pointer;"
                    data-judul="Prime 02 Vandal | Dolmirs Vandal | Rogue Vandal | Soverign Phantom | Nocturnum Scythe"
                    data-harga="Rp 500.000"
                    data-kode="VALO-03"
                    data-gambar="images/skin-valo3.jpg"
                    data-gambarss="images/ss_valo1.png,images/ss_valo2.jpg,images/ss_valo3.png,images/ss_valo4.png,images/ss_valo5.png"
                    data-spek="Total Skin: 15|Rank: Diamond|Agent Terbuka: Semua">
                    
                    <img src="images/skin-valo3.jpg" alt="Akun Valorant"> 
                    <div class="card-katalog-info">
                        <h4>Prime 02 Vandal | Dolmirs Vandal | Rogue Vandal | Soverign Phantom | Nocturnum Scythe</h4>
                        <p class="harga-coret">Rp700.000</p>
                        <p class="harga-asli">Rp 500.000</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Panggil fungsi filter dan fungsi pemindah data -->
    <script src="script-beli-akun.js"></script>
    <script src="script-katalog.js"></script>
</body>
</html>
