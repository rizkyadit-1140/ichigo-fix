<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Akun Mobile Legends - Ichigo Store</title>
    <link rel="stylesheet" href="style.css"> <!-- Menggunakan CSS yang sama -->
</head>
<body>

    <!-- ========================================== -->
    <!-- PASTE KODE NAVBAR DARI HALAMAN UTAMA DISINI -->
    <!-- ========================================== -->
    
    <!-- Wadah Utama Halaman Katalog Akun -->
    <div class="container-akun-katalog">
        
        <!-- ============================== -->
        <!-- BAGIAN KIRI: SIDEBAR FILTER    -->
        <!-- ============================== -->
        <aside class="sidebar-filter">
            <h3>Filter</h3>
            
            <div class="filter-group">
                <label>Rank Tertinggi</label>
                <select>
                    <option>Pilih rank tertinggi</option>
                    <option>Mythical Glory</option>
                    <option>Mythical Immortal</option>
                    <option>Mythic</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Harga Minimal</label>
                <div class="input-rp">
                    <span>Rp</span>
                    <input type="number" placeholder="">
                </div>
            </div>

            <div class="filter-group">
                <label>Harga Maksimal</label>
                <div class="input-rp">
                    <span>Rp</span>
                    <input type="number" placeholder="">
                </div>
            </div>

            <div class="filter-group">
                <label>Urutkan Harga</label>
                <div class="radio-group">
                    <input type="radio" id="termurah" name="urutkan">
                    <label for="termurah">Termurah Ke Termahal</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="termahal" name="urutkan">
                    <label for="termahal">Termahal Ke Termurah</label>
                </div>
            </div>

            <button class="btn-filter">Filter</button>
            <button class="btn-reset">Reset Filter</button>
        </aside>

        <!-- ============================== -->
        <!-- BAGIAN KANAN: KONTEN PRODUK    -->
        <!-- ============================== -->
        <main class="content-akun">
            
            <!-- Pencarian -->
            <div class="search-akun-bar">
                <input type="text" placeholder="Cari Judul Akun, Skin, Effect Recall dll">
                <button>Cari</button>
            </div>

            <!-- Grid Produk Akun -->
            <div class="grid-katalog-akun">
                
                <!-- Kotak Akun 1 -->
                <div class="card-katalog-item">
                    <!-- Ganti src dengan gambar akun dari komputermu -->
                    <img src="akun-ml-1.jpg" alt="Akun ML"> 
                    <div class="card-katalog-info">
                        <h4>Valir Legend | Alpha Abyss | 6 Luckybox</h4>
                        <p class="harga-coret">Rp 699.999</p>
                        <p class="harga-asli">Rp 649.999</p>
                    </div>
                </div>

                <!-- Kotak Akun 2 -->
                <div class="card-katalog-item">
                    <img src="akun-ml-2.jpg" alt="Akun ML">
                    <div class="card-katalog-info">
                        <h4>Johnson Legend | Xborg Metro Zero</h4>
                        <p class="harga-coret">Rp 799.999</p>
                        <p class="harga-asli">Rp 799.999</p>
                    </div>
                </div>

                <!-- Kotak Akun 3 -->
                <div class="card-katalog-item">
                    <img src="akun-ml-3.jpg" alt="Akun ML">
                    <div class="card-katalog-info">
                        <h4>Alucard Lightborn | Freya Epic</h4>
                        <p class="harga-coret">Rp 149.999</p>
                        <p class="harga-asli">Rp 119.999</p>
                    </div>
                </div>

                <!-- Bisa di-copy-paste terus untuk menambah kotak lainnya -->

            </div>
        </main>
    </div>
    <script src="script-beli-akun.js"></script>
</body>
</html>
