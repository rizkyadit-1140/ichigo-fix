<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Akun Mobile Legends - Ichigo Store</title>
    <link rel="stylesheet" href="style.css"> <!-- Menggunakan CSS yang sama -->
</head>
<body>
    
    <!-- Wadah Utama Halaman Katalog Akun -->
    <div class="container-akun-katalog">
        
        <!-- ============================== -->
        <!-- BAGIAN KIRI: SIDEBAR FILTER    -->
        <!-- ============================== -->
        <aside class="sidebar-filter">
            <h3>Filter</h3>

            <div class="filter-group">
                <label>Harga Minimal</label>
                <div class="input-rp">
                    <span>Rp</span>
                    <input type="number" placeholder="">
                </div>
            </div>

            <div class="filter-group">
                <label>Harga Maksimal</label>
                <div class="input-rp">
                    <span>Rp</span>
                    <input type="number" placeholder="">
                </div>
            </div>

            <div class="filter-group">
                <label>Urutkan Harga</label>
                <div class="radio-group">
                    <input type="radio" id="termurah" name="urutkan">
                    <label for="termurah">Termurah Ke Termahal</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="termahal" name="urutkan">
                    <label for="termahal">Termahal Ke Termurah</label>
                </div>
            </div>

            <button class="btn-filter">Filter</button>
            <button class="btn-reset">Reset Filter</button>
        </aside>

        <!-- ============================== -->
        <!-- BAGIAN KANAN: KONTEN PRODUK    -->
        <!-- ============================== -->
        <main class="content-akun">
            
            <!-- Pencarian -->
            <div class="search-akun-bar">
                <input type="text" placeholder="Cari Judul Akun, Skin, Effect Recall dll">
                <button>Cari</button>
            </div>

            <!-- Grid Produk Akun -->
            <div class="grid-katalog-akun">
                
                <!-- Kotak Akun 1 -->
                <div class="card-katalog-item" style="cursor: pointer;"
                    data-judul="Suyou Sasuke | Haya Kakashi | 4 LuckyBox | Amoon Colector"
                    data-harga="Rp 349.000"
                    data-kode="ML-01"
                    data-gambar="images/skinml1.png"
                    data-gambarss="images/spekml1.png,images/spekml2.png,images/spekml3.png,images/spekml4.png,images/spekml5.png,images/spekml6.png,images/spekml7.png"
                    data-spek="Rank: IMO 188|Total Skin: 150|Hero: Max">
                    
                    <!-- Ganti src dengan gambar akun dari komputermu -->
                    <img src="images/skinml1.png" alt="Akun ML"> 
                    <div class="card-katalog-info">
                        <h4>Suyou Sasuke | Haya Kakashi | 4 LuckyBox | Amoon Colector</h4>
                        <p class="harga-coret">Rp 425.000</p>
                        <p class="harga-asli">Rp 349.000</p>
                    </div>
                </div>
                
                <!-- Kotak Akun 2 -->
                <div class="card-katalog-item" style="cursor: pointer;"
                    data-judul="YSS Collector"
                    data-harga="Rp 450.000"
                    data-kode="ML-02"
                    data-gambar="images/skinml2.png"
                    data-gambarss="images/mlspek1.png,images/mlspek2.png,images/mlspek3.png"
                    data-spek="Rank: Glory 69|Total Skin: 231|Hero: Max">
                    
                    <!-- Ganti src dengan gambar akun dari komputermu -->
                    <img src="images/skinml2.png" alt="Akun ML"> 
                    <div class="card-katalog-info">
                        <h4>YSS Collector</h4>
                        <p class="harga-coret">Rp 700.000</p>
                        <p class="harga-asli">Rp 450.00/p>
                    </div>
                </div>

                <!-- Kotak Akun 3 -->
                <div class="card-katalog-item" style="cursor: pointer;"
                    data-judul="Ling CC polosan"
                    data-harga="Rp 120.000"
                    data-kode="ML-03"
                    data-gambar="images/skinml3.png"
                    data-gambarss="images/mls1.png"
                    data-spek="Rank: Imo 105kin:78|Hero: 82">
                    
                    <!-- Ganti src dengan gambar akun dari komputermu -->
                    <img src="images/skinml3.png" alt="Akun ML"> 
                    <div class="card-katalog-info">
                        <h4>YSS Collector</h4>
                        <p class="harga-coret">Rp 300.000</p>
                        <p class="harga-asli">Rp 120.000/p>
                    </div>
                </div>


            </div>
        </main>
    </div>
    <script src="script-beli-akun.js"></script>
    <script src="script-katalog.js"></script> <!-- TAMBAHKAN BARIS INI -->
</body>
</html>
